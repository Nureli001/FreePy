<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Python IDLE">
<meta name="theme-color" content="#1e1e2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Python IDLE</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:#1e1e2e;color:#cdd6f4;font-family:-apple-system,system-ui,sans-serif;
    display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;gap:8px;padding:10px 0}
  h1{font-size:18px;margin:0;flex:1}
  #status{font-size:12px;color:#a6adc8}
  button{background:#89b4fa;color:#1e1e2e;border:0;border-radius:8px;padding:10px 16px;font-size:16px;font-weight:600}
  button.sec{background:#45475a;color:#cdd6f4}
  button:disabled{opacity:.4}
  textarea,pre{font-family:ui-monospace,Menlo,monospace;font-size:15px;border-radius:8px;margin:0;width:100%}
  textarea{flex:1;min-height:0;background:#11111b;color:#cdd6f4;border:1px solid #45475a;padding:10px;resize:none;tab-size:4}
  .bar{display:flex;gap:8px;padding:8px 0}
  pre{flex:1;min-height:0;background:#11111b;border:1px solid #45475a;padding:10px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  .err{color:#f38ba8}
</style>
</head>
<body>
<header><h1>🐍 Python IDLE</h1><span id="status">Yüklənir…</span></header>
<textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">name = "Dünya"
print(f"Salam, {name}!")

for i in range(1, 6):
    print(i, "x", i, "=", i * i)</textarea>
<div class="bar">
  <button id="run" disabled>▶ İşlət</button>
  <button id="clear" class="sec">Təmizlə</button>
</div>
<pre id="out"></pre>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const $ = id => document.getElementById(id);
const code = $("code"), out = $("out"), runBtn = $("run"), status = $("status");

try { const s = localStorage.getItem("code"); if (s) code.value = s; } catch(e){}
code.addEventListener("input", () => { try { localStorage.setItem("code", code.value); } catch(e){} });

code.addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault();
    const s = code.selectionStart;
    code.setRangeText("    ", s, code.selectionEnd, "end");
  }
});

function write(text, cls) {
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = text;
  out.appendChild(span);
  out.scrollTop = out.scrollHeight;
}

let py;
async function init() {
  try {
    py = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" });
    py.setStdout({ batched: s => write(s + "\n") });
    py.setStderr({ batched: s => write(s + "\n", "err") });
    status.textContent = "Hazırdır ✓";
    runBtn.disabled = false;
  } catch (e) {
    status.textContent = "Yüklənmədi. İnternetə qoşulub yenidən aç.";
  }
}

runBtn.onclick = async () => {
  runBtn.disabled = true;
  out.textContent = "";
  try {
    await py.runPythonAsync(code.value);
  } catch (e) {
    write(String(e.message || e), "err");
  }
  runBtn.disabled = false;
};
$("clear").onclick = () => { out.textContent = ""; };

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
init();
</script>
</body>
</html>
